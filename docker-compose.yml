services:
  db:
    image: postgres:16-alpine
    container_name: tourpoints_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tourpoints
      POSTGRES_PASSWORD: tourpoints
      POSTGRES_DB: tourpoints
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourpoints -d tourpoints"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: tourpoints_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: